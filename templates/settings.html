<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>quote0-desk · 设置</title>
<style>
body{font-family:-apple-system,Helvetica,Arial,sans-serif;background:#f5f3ee;color:#1d1d1f;margin:0;padding:18px;max-width:520px;margin-left:auto;margin-right:auto}
h1{font-size:20px;margin:4px 0 14px}
.card{background:#fff;padding:18px;border-radius:18px;margin:12px 0;box-shadow:0 8px 24px rgba(0,0,0,.07)}
.field{margin:14px 0}
.field label{display:block;font-size:13px;color:#6e6e73;margin-bottom:6px}
.field .hint{font-size:12px;color:#8e8e93;margin-top:4px;line-height:1.5}
input[type=text]{width:100%;box-sizing:border-box;border:1px solid #e3ded5;border-radius:12px;background:#fbfaf7;color:#1d1d1f;font-size:15px;padding:12px}
input[type=number]{width:100%;box-sizing:border-box;border:1px solid #e3ded5;border-radius:12px;background:#fbfaf7;color:#1d1d1f;font-size:15px;padding:12px}
.btn{width:100%;background:#111;color:#fff;padding:15px;text-align:center;border:0;border-radius:12px;font-size:17px;cursor:pointer;margin-top:8px}
.msg{font-size:13px;text-align:center;padding:8px;border-radius:8px;margin-top:12px}
.msg.ok{background:#e8f8ea;color:#248a3d}
.msg.err{background:#fdecea;color:#d70015}
.back{display:inline-block;margin-bottom:10px;color:#6e6e73;font-size:14px;text-decoration:none}
.switch{display:flex;align-items:center;justify-content:space-between}
.switch input[type=checkbox]{width:44px;height:26px;-webkit-appearance:none;appearance:none;background:#d1d1d6;border-radius:999px;position:relative;cursor:pointer;outline:none;transition:background .15s}
.switch input[type=checkbox]:checked{background:#34c759}
.switch input[type=checkbox]::before{content:'';position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input[type=checkbox]:checked::before{left:20px}
.warn{font-size:12px;color:#a15c00;background:#fff6e5;border-radius:8px;padding:8px 10px;margin-top:10px;line-height:1.5}
.checkrow{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px}
</style>
</head>
<body>
<a class="back" href="/">← 返回</a>
<h1>设置</h1>

<div class="card">
  <div class="field">
    <label>NFC 回调地址（nfc_base_url）</label>
    <input type="text" id="nfc_base_url" placeholder="https://xxxx.trycloudflare.com">
    <div class="hint">贴 NFC 时打开的地址前缀，各卡的 <code>link</code> 都从这里拼。装了 <code>scripts/install_launchd.sh</code> 的话这个值会被隧道守护脚本自动覆盖，手动改了也会在下次隧道重连时被新地址盖掉——手动改主要用在临时改成局域网 IP 测试的场景。</div>
  </div>
  <button class="btn" onclick="saveConfig()">保存</button>
  <div id="msg"></div>
</div>

<div class="card">
  <h1 style="font-size:17px;margin-top:0">自动轮换</h1>
  <div class="field switch">
    <label style="margin:0">布防（开启后按周期自动推送）</label>
    <input type="checkbox" id="auto_push_enabled">
  </div>
  <div class="warn">
    需要 <code>server.py</code>（或装好的 launchd 服务）常驻运行才生效——调度线程是随 Flask 一起起的。
  </div>
  <div class="field">
    <label>推送周期（分钟）</label>
    <input type="number" id="auto_push_interval_minutes" min="1">
  </div>
  <div class="field">
    <label>轮换哪些卡</label>
    <div id="cardChecks"></div>
    <div class="hint">签筒（qiantong）是 NFC 触发的，不建议放进自动轮换。</div>
  </div>
  <button class="btn" onclick="saveConfig()">保存</button>
  <div id="msg2"></div>
</div>

<script>
let CARDS = {};

async function loadCards(){
  const r = await fetch('/api/cards');
  CARDS = await r.json();
  const box = document.getElementById('cardChecks');
  box.innerHTML = Object.entries(CARDS).map(([key, label]) =>
    `<div class="checkrow"><input type="checkbox" value="${key}" class="cardcheck"> ${label}</div>`
  ).join('');
}

async function loadConfig(){
  await loadCards();
  const r = await fetch('/api/config');
  const cfg = await r.json();
  document.getElementById('nfc_base_url').value = cfg.nfc_base_url || '';
  document.getElementById('auto_push_enabled').checked = !!cfg.auto_push_enabled;
  document.getElementById('auto_push_interval_minutes').value = cfg.auto_push_interval_minutes || 10;
  const active = new Set(cfg.auto_push_cards || []);
  document.querySelectorAll('.cardcheck').forEach(el => { el.checked = active.has(el.value); });
}

async function saveConfig(){
  const cards = Array.from(document.querySelectorAll('.cardcheck:checked')).map(el => el.value);
  const body = {
    nfc_base_url: document.getElementById('nfc_base_url').value.trim(),
    auto_push_enabled: document.getElementById('auto_push_enabled').checked,
    auto_push_interval_minutes: Math.max(1, parseInt(document.getElementById('auto_push_interval_minutes').value) || 10),
    auto_push_cards: cards,
  };
  const msg = document.getElementById('msg');
  const msg2 = document.getElementById('msg2');
  try{
    const r = await fetch('/api/config', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    });
    if(r.ok){
      msg.innerHTML = '<div class="msg ok">已保存</div>';
      msg2.innerHTML = '<div class="msg ok">已保存</div>';
    } else {
      msg.innerHTML = '<div class="msg err">保存失败</div>';
    }
  }catch(e){
    msg.innerHTML = `<div class="msg err">网络错误：${e}</div>`;
  }
}

loadConfig();
</script>
</body>
</html>
